<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Мини-Тетрис</title>
<style>
  body { display: flex; justify-content: center; margin-top: 50px; background: #222; color: #eee; font-family: monospace; }
  canvas { background: #000; border: 2px solid #555; }
</style>
</head>
<body>
<canvas id="game" width="200" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const ROWS = 20, COLS = 10, BLOCK_SIZE = 20;

const COLORS = [
  null,
  'cyan', 'blue', 'orange', 'yellow', 'green', 'purple', 'red'
];

// Тетромино (формы)
const SHAPES = [
  [],
  [[1,1,1,1]],              // I
  [[2,0,0],[2,2,2]],        // J
  [[0,0,3],[3,3,3]],        // L
  [[4,4],[4,4]],            // O
  [[0,5,5],[5,5,0]],        // S
  [[0,6,0],[6,6,6]],        // T
  [[7,7,0],[0,7,7]]         // Z
];

// Создаем пустое игровое поле
function createMatrix(rows, cols) {
  const matrix = [];
  while (rows--) matrix.push(new Array(cols).fill(0));
  return matrix;
}

const board = createMatrix(ROWS, COLS);

// Текущая фигура
const player = {
  pos: {x: 3, y: 0},
  matrix: SHAPES[1]
};

// Рисуем блок
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
  ctx.strokeStyle = '#222';
  ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
}

// Рисуем матрицу (текущую фигуру или поле)
function drawMatrix(matrix, offset) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        drawBlock(x + offset.x, y + offset.y, COLORS[value]);
      }
    });
  });
}

// Перемещение фигуры вниз
function playerDrop() {
  player.pos.y++;
  if (collide(board, player)) {
    player.pos.y--;
    merge(board, player);
    playerReset();
  }
  dropCounter = 0;
}

// Проверка столкновений
function collide(board, player) {
  const m = player.matrix;
  const o = player.pos;
  for (let y = 0; y < m.length; y++) {
    for (let x = 0; x < m[y].length; x++) {
      if (m[y][x] !== 0 &&
         (board[y + o.y] &&
          board[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

// Включаем фигуру в игровое поле
function merge(board, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        board[y + player.pos.y][x + player.pos.x] = value;
      }
    });
  });
}

// Сброс фигуры (новая фигура)
function playerReset() {
  const pieces = 'TJLOSZI';
  const index = pieces.length * Math.random() | 0;
  player.matrix = SHAPES[index + 1];
  player.pos.y = 0;
  player.pos.x = 3;
  if (collide(board, player)) {
    alert('Игра окончена');
    board.forEach(row => row.fill(0));
  }
}

// Отрисовка фрейма
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawMatrix(board, {x: 0, y: 0});
  drawMatrix(player.matrix, player.pos);
}

// Глобальные таймеры
let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;

// Игровой цикл
function update(time = 0) {
  const deltaTime = time - lastTime;
  lastTime = time;
  dropCounter += deltaTime;
  if (dropCounter > dropInterval) {
    playerDrop();
  }
  draw();
  requestAnimationFrame(update);
}

// Управление с клавиатуры
document.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') {
    player.pos.x--;
    if (collide(board, player)) player.pos.x++;
  } else if (event.key === 'ArrowRight') {
    player.pos.x++;
    if (collide(board, player)) player.pos.x--;
  } else if (event.key === 'ArrowDown') {
    playerDrop();
  } else if (event.key === 'ArrowUp') {
    player.matrix = rotate(player.matrix);
    if (collide(board, player)) {
      player.matrix = rotate(player.matrix, true);
    }
  }
});

// Поворот матрицы (фигуры)
function rotate(matrix, reverse = false) {
  const m = matrix;
  const N = m.length;
  const result = createMatrix(N, N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (!reverse) {
        result[x][N - 1 - y] = m[y][x];
      } else {
        result[N - 1 - x][y] = m[y][x];
      }
    }
  }
  return result;
}

update();
</script>
</body>
</html>
